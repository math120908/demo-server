<!DOCTYPE html>
<html lang="{{ lang }}" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>
  <link rel="stylesheet" href="/__reader__/reader.css?v={{ reader_version }}">
  <script>
  (function () {
    try {
      var ui = JSON.parse(localStorage.getItem('mdr-ui') || '{}');
      if (!ui.theme) {
        var legacy = localStorage.getItem('theme');
        ui.theme = legacy || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      }
      document.documentElement.setAttribute('data-theme', ui.theme);
      if (ui.skin && ui.skin !== 'default') document.documentElement.setAttribute('data-skin', ui.skin);
    } catch (e) {}
  })();
  </script>
  <style>
    /* GitHub-style Markdown Theme */
    :root {
      --bg: #ffffff;
      --surface: #f6f8fa;
      --text: #1f2328;
      --text-sec: #656d76;
      --text-muted: #818b98;
      --primary: #0969da;
      --primary-hover: #0a5cc5;
      --primary-light: #eff1f3;
      --accent: #1a7f37;
      --accent-light: #dafbe1;
      --warn: #9a6700;
      --warn-light: #fff8c5;
      --danger: #cf222e;
      --border: #d1d9e0;
      --border-strong: #d8dee4;
      --shadow: 0 1px 3px rgba(31,35,40,.08);
      --shadow-md: 0 4px 12px rgba(31,35,40,.12);
      --radius: 8px;
      --radius-sm: 6px;
    }
    [data-theme="dark"] {
      --bg: #0d1117;
      --surface: #161b22;
      --text: #e6edf3;
      --text-sec: #9198a1;
      --text-muted: #6e7681;
      --primary: #4493f8;
      --primary-hover: #58a6ff;
      --primary-light: #121d2f;
      --accent: #3fb950;
      --accent-light: #12261e;
      --warn: #d29922;
      --warn-light: #3b2e08;
      --danger: #f85149;
      --border: #3d444d;
      --border-strong: #2f3742;
      --shadow: 0 1px 3px rgba(0,0,0,.3);
      --shadow-md: 0 4px 12px rgba(0,0,0,.4);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }
    .md-container {
      max-width: 860px;
      margin: 0 auto;
      padding: 3rem 2rem 4rem;
    }
    @media (max-width: 640px) {
      .md-container { padding: 2rem 1rem 3rem; }
    }

    h1, h2, h3, h4, h5, h6 {
      margin-top: 1.5em;
      margin-bottom: 0.5em;
      font-weight: 600;
      line-height: 1.25;
    }
    h1 { font-size: 2em; margin-top: 0; padding-bottom: 0.3em; border-bottom: 1px solid var(--border); }
    h2 { font-size: 1.5em; padding-bottom: 0.3em; border-bottom: 1px solid var(--border); }
    h3 { font-size: 1.25em; }
    h4 { font-size: 1em; }

    p { margin-bottom: 1em; }
    a { color: var(--primary); text-decoration: none; }
    a:hover { text-decoration: underline; }
    hr { border: none; border-top: 1px solid var(--border); margin: 1.5em 0; }

    ul, ol { margin-bottom: 1em; padding-left: 2em; }
    li { margin-bottom: 0.25em; }
    li > ul, li > ol { margin-top: 0.25em; margin-bottom: 0; }
    li input[type="checkbox"] { margin-right: 0.35em; }

    blockquote {
      border-left: 4px solid var(--border);
      padding: 0 1em;
      margin: 1em 0;
      color: var(--text-sec);
    }
    blockquote p:last-child { margin-bottom: 0; }

    code {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.85em;
      background: var(--primary-light);
      padding: 0.2em 0.4em;
      border-radius: 6px;
    }
    pre {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1rem;
      overflow-x: auto;
      margin: 1em 0;
      line-height: 1.45;
    }
    pre code {
      background: none;
      padding: 0;
      font-size: 0.85em;
    }

    {{ highlight_css }}

    table {
      width: 100%;
      border-collapse: collapse;
      margin: 1em 0;
    }
    th, td {
      padding: 6px 13px;
      border: 1px solid var(--border);
    }
    th { font-weight: 600; background: var(--surface); }
    tr:nth-child(even) { background: var(--surface); }

    img { max-width: 100%; height: auto; }

    .md-card {
      background: linear-gradient(135deg, var(--card-bg, var(--primary-light)) 0%, var(--card-bg2, var(--accent-light)) 100%);
      border: 1px solid var(--card-border, var(--primary));
      border-radius: 8px; padding: 24px 28px; margin: 1em 0; position: relative;
    }
    .md-card .card-label {
      position: absolute; top: -12px; left: 24px;
      background: var(--card-badge-bg, var(--primary)); color: var(--card-badge-text, var(--surface));
      padding: 4px 12px; border-radius: 999px; font-size: 11px;
      font-family: ui-monospace, monospace; letter-spacing: 0.08em; font-weight: 600;
    }
    .md-card .card-label:not(:empty) + * { margin-top: 8px; }
    .md-card h2, .md-card h3 { color: var(--card-text, var(--primary-hover)); border: none; padding: 0; }
    .md-callout {
      background: var(--surface); border: 1px dashed var(--card-border, var(--border));
      border-radius: 6px; padding: 14px 18px; margin: 1em 0; font-size: 14px;
    }
    .md-callout > *:first-child { margin-top: 0; }
    .md-callout > *:last-child { margin-bottom: 0; }
    .md-callout strong { color: var(--card-text, var(--primary)); }

    details { margin: 1em 0; }
    summary { cursor: pointer; font-weight: 600; }
    details.fold-block {
      border: 1px solid var(--border); border-radius: 6px;
      padding: 0; overflow: hidden;
    }
    details.fold-block summary {
      padding: 8px 16px; color: var(--primary);
      list-style: none;
    }
    details.fold-block summary::-webkit-details-marker { display: none; }
    details.fold-block summary::before { content: "▶ "; font-size: 0.75em; }
    details.fold-block[open] summary::before { content: "▼ "; }
    details.fold-block[open] summary {
      background: var(--surface); border-bottom: 1px solid var(--border);
    }
    details.fold-block > *:not(summary) { padding: 0 16px; }
    details.fold-block > p:last-child { padding-bottom: 10px; }
  </style>
</head>
<body>
  <div id="mdr-rail" class="mdr-rail" role="toolbar" aria-label="Reader tools"></div>
  <aside id="mdr-panel" class="mdr-panel" aria-hidden="true">
    <header class="mdr-panel-head">
      <h2 id="mdr-panel-title" class="mdr-panel-title"></h2>
      <div id="mdr-panel-actions" class="mdr-panel-actions"></div>
      <button id="mdr-panel-close" class="mdr-panel-close" aria-label="Close panel" type="button">&#10005;</button>
    </header>
    <div id="mdr-panel-body" class="mdr-panel-body"></div>
  </aside>
  <div class="md-container" id="mdr-content">
    {{ content }}
  </div>
  <script src="/__reader__/reader.js?v={{ reader_version }}" defer></script>
  <script src="/__reader__/comments.js?v={{ reader_version }}" defer></script>
</body>
</html>
