<!DOCTYPE html>
<html lang="{{ lang }}" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>
  <link rel="stylesheet" href="/__reader__/reader.css?v={{ reader_version }}">
  <script>
  (function () {
    try {
      var ui = JSON.parse(localStorage.getItem('mdr-ui') || '{}');
      if (!ui.theme) {
        var legacy = localStorage.getItem('theme');
        ui.theme = legacy || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      }
      document.documentElement.setAttribute('data-theme', ui.theme);
      if (ui.skin && ui.skin !== 'default') document.documentElement.setAttribute('data-skin', ui.skin);
    } catch (e) {}
  })();
  </script>
  <style>
    /* Minimal — Typography-focused theme */
    :root {
      --bg: #fafafa;
      --surface: #ffffff;
      --text: #2c2c2c;
      --text-sec: #555555;
      --text-muted: #777777;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #f0f0f0;
      --accent: #64748b;
      --accent-light: #f1f5f9;
      --warn: #b45309;
      --warn-light: #fef3c7;
      --danger: #dc2626;
      --border: #dddddd;
      --border-strong: #cccccc;
      --shadow: 0 1px 3px rgba(0,0,0,.06);
      --shadow-md: 0 4px 12px rgba(0,0,0,.1);
      --radius: 6px;
      --radius-sm: 4px;
    }
    [data-theme="dark"] {
      --bg: #111318;
      --surface: #1b1f27;
      --text: #e8e8e8;
      --text-sec: #b6bbc5;
      --text-muted: #858c99;
      --primary: #58a6ff;
      --primary-hover: #79b8ff;
      --primary-light: #202c3d;
      --accent: #94a3b8;
      --accent-light: #253043;
      --warn: #fbbf24;
      --warn-light: #422006;
      --danger: #f87171;
      --border: #1e293b;
      --border-strong: #334155;
      --shadow: 0 1px 3px rgba(0,0,0,.3);
      --shadow-md: 0 4px 12px rgba(0,0,0,.4);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 17px;
      line-height: 1.7;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }
    .md-container {
      max-width: 680px;
      margin: 0 auto;
      padding: 4rem 1.5rem 5rem;
    }

    h1, h2, h3, h4, h5, h6 {
      margin-top: 2em;
      margin-bottom: 0.5em;
      font-weight: 700;
      line-height: 1.3;
      color: var(--text);
    }
    h1 { font-size: 2rem; margin-top: 0; }
    h2 { font-size: 1.5rem; }
    h3 { font-size: 1.2rem; }

    p { margin-bottom: 1.2em; }
    a { color: var(--primary); text-decoration: underline; text-underline-offset: 2px; }
    a:hover { color: var(--primary-hover); }
    strong { font-weight: 600; }
    hr { border: none; border-top: 1px solid var(--border); margin: 2em 0; }

    ul, ol { margin-bottom: 1.2em; padding-left: 1.5em; }
    li { margin-bottom: 0.3em; }
    li input[type="checkbox"] { margin-right: 0.35em; }

    blockquote {
      border-left: 3px solid var(--border-strong);
      padding: 0 1em;
      margin: 1.2em 0;
      color: var(--text-sec);
    }
    blockquote p:last-child { margin-bottom: 0; }

    code {
      font-family: "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.85em;
      background: var(--primary-light);
      padding: 0.15em 0.35em;
      border-radius: 3px;
    }
    pre {
      background: var(--surface);
      border-radius: 4px;
      padding: 1rem;
      overflow-x: auto;
      margin: 1.2em 0;
    }
    pre code {
      background: none;
      padding: 0;
      font-size: 0.85em;
      line-height: 1.6;
    }

    {{ highlight_css }}

    table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.2em 0;
      font-size: 0.95em;
    }
    th, td {
      padding: 0.5em 0.8em;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }
    th { font-weight: 600; border-bottom-width: 2px; }

    .md-card {
      background: linear-gradient(135deg, var(--card-bg, var(--bg)) 0%, var(--card-bg2, var(--accent-light)) 100%);
      border: 1px solid var(--card-border, var(--accent));
      border-radius: 6px; padding: 20px 24px; margin: 1.2em 0; position: relative;
    }
    .md-card .card-label {
      position: absolute; top: -11px; left: 20px;
      background: var(--card-badge-bg, var(--accent)); color: var(--card-badge-text, var(--surface));
      padding: 3px 10px; border-radius: 999px; font-size: 11px;
      font-family: "SF Mono", Menlo, monospace; letter-spacing: 0.06em; font-weight: 600;
    }
    .md-card .card-label:not(:empty) + * { margin-top: 6px; }
    .md-card h2, .md-card h3 { color: var(--card-text, var(--text)); border: none; }
    .md-callout {
      background: var(--surface); border: 1px dashed var(--card-border, var(--border-strong));
      border-radius: 4px; padding: 12px 16px; margin: 1em 0;
    }
    .md-callout > *:first-child { margin-top: 0; }
    .md-callout > *:last-child { margin-bottom: 0; }

    details.fold-block {
      border: 1px solid var(--border); border-radius: 4px;
      padding: 0; margin: 1.2em 0; overflow: hidden;
    }
    details.fold-block summary {
      padding: 0.6em 1em; cursor: pointer; font-weight: 600;
      list-style: none; color: var(--primary);
    }
    details.fold-block summary::-webkit-details-marker { display: none; }
    details.fold-block summary::before { content: "▶ "; font-size: 0.75em; }
    details.fold-block[open] summary::before { content: "▼ "; }
    details.fold-block[open] summary { border-bottom: 1px solid var(--border); background: var(--surface); }
    details.fold-block > *:not(summary) { padding: 0 1em; }
    details.fold-block > p:last-child { padding-bottom: 0.6em; }

    img { max-width: 100%; height: auto; }
  </style>
</head>
<body>
  <div id="mdr-rail" class="mdr-rail" role="toolbar" aria-label="Reader tools"></div>
  <aside id="mdr-panel" class="mdr-panel" aria-hidden="true">
    <header class="mdr-panel-head">
      <h2 id="mdr-panel-title" class="mdr-panel-title"></h2>
      <div id="mdr-panel-actions" class="mdr-panel-actions"></div>
      <button id="mdr-panel-close" class="mdr-panel-close" aria-label="Close panel" type="button">&#10005;</button>
    </header>
    <div id="mdr-panel-body" class="mdr-panel-body"></div>
  </aside>
  <div class="md-container" id="mdr-content">
    {{ content }}
  </div>
  <script src="/__reader__/reader.js?v={{ reader_version }}" defer></script>
  <script src="/__reader__/comments.js?v={{ reader_version }}" defer></script>
</body>
</html>
